spring.application.name=face-checkin-mvc
server.port=8081

# ขนาดไฟล์ภาพที่อนุญาตให้อัปโหลดสูงสุด
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=30MB

# ตั้งค่า Python Executable และ Script
app.python.executable=python3
app.python.script=python/face_engine.py

# โฟลเดอร์จัดเก็บข้อมูลภาพใบหน้านักศึกษาที่ลงทะเบียนแล้ว
app.storage.dir=data/students

# พิกัดห้องเรียนเริ่มต้น (เช่น มหาวิทยาลัยขอนแก่น / ห้องเรียนเริ่มต้น) และรัศมีที่อนุญาต (เมตร)
app.classroom.name=ห้องเรียน SC-9101 (Smart Classroom)
app.classroom.latitude=16.4745
app.classroom.longitude=102.8230
app.classroom.radius-meters=150.0
